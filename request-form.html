<!doctype html>
<html lang="en">

    <title>Request a Tutoring Session</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<body>
    <nav class="container py-3" aria-label="Main navigation">

        <a class="me-3" href="tutors.html">View Tutors</a>
        <a href="request-form.html">Request a Session</a>
    </nav>
    <main class="container py-4">
        
<h1>Request a Tutoring Session</h1>
<form action="process-request.php" method="post">
    <label class="form-label" for="course">Course</label>
    <input class="form-control" type="text"
           id="course" name="course" required>

    <label class="form-label" for="date">Preferred Date</label>
    <input class="form-control" type="date"
           id="date" name="date" required>

    <button class="btn btn-danger" type="submit">
        Request Session
    </button>
</form>

    </main>
